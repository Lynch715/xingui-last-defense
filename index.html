<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星轨:最后防线</title>
<style>

  #panel { width: 224px; display: flex; flex-direction: column; gap: 10px; }
  #panelCols { display: flex; flex-direction: column; gap: 10px; }
  .card { background: rgba(22,30,54,.7); border: 1px solid rgba(120,150,220,.16);

  .selrow { display:flex; justify-content:space-between; font-size:12px; margin:3px 0; }
  .selrow span { color:#9aabd4; }
  .selrow b { color:#fff; }
  .branchTip { font-size:11px; color:#ffd76b; margin:6px 0 4px; font-weight:700; }
  .branch-btn { width:100%; text-align:left; padding:8px 10px; margin-bottom:6px; border-radius:9px;
    cursor:pointer; border:1.5px solid rgba(140,170,230,.25); background:rgba(40,52,86,.7); color:#e6ecfa; transition:.15s; }
  .branch-btn:hover { border-color:#fff; background:rgba(56,72,116,.9); }

    .mapcard { padding:10px 12px; }
    .mapcard .md { min-height:0; }
    .menu-title { font-size:24px; }

</style>

<body>
<div id="wrap" class="menu-mode">
  <div id="stage">
    <canvas id="cv" width="640" height="560"></canvas>
    <div id="hud">
      <div class="stat" id="uiMapWrap"><span class="ic">🗺️</span><span id="uiMap">—</span></div>
      <div class="stat"><span class="ic">❤️</span><b id="uiHp">20</b></div>
      <div class="stat"><span class="ic">💰</span><b id="uiGold">120</b></div>
      <div class="stat"><span class="ic">🌊</span><b id="uiWave">0</b><span style="color:#6f7fa6" id="uiWaveMax">/∞</span></div>
      <div class="stat"><span class="ic">⭐</span><b id="uiScore">0</b></div>
      <button id="btnMenu" onclick="backToMenu()">选关</button>
      <button id="btnAudio" type="button" aria-label="声音设置" title="声音设置">🔊</button>
    </div>
    <div id="banner"></div>
    <div id="audioPanel" aria-hidden="true">
      <div class="audio-head"><b>声音设置</b><button id="btnAudioClose" type="button" aria-label="关闭声音设置">×</button></div>
      <label class="audio-row"><span>音乐</span><input id="bgmVolume" type="range" min="0" max="100" step="1"><output id="bgmVolumeValue">28%</output></label>
      <label class="audio-row"><span>音效</span><input id="sfxVolume" type="range" min="0" max="100" step="1"><output id="sfxVolumeValue">68%</output></label>
      <button class="act sec" id="btnMuteAudio" type="button">全部静音</button>
      <div class="audio-credit">CC0 音效：<a href="https://kenney.nl/assets/sci-fi-sounds" target="_blank" rel="noopener">Kenney</a> · BGM：<a href="https://opengameart.org/content/dark-sci-fi-audio-pack" target="_blank" rel="noopener">SRG774</a></div>
    </div>

    <!-- 选关 -->
    <div class="overlay show" id="menu">
      <div class="menu-title">星轨:<span>最后防线</span></div>
      <div class="sub">选择关卡 · 半放置塔防</div>
      <div id="menuList"></div>
      <div class="menu-actions">
        <button class="act sec" id="btnTalent" onclick="openTalent()">⭐ 转生天赋</button>
        <button class="act warn" id="btnRank" onclick="openLeaderboard('menu')">🏅 无尽战绩</button>

      </div>
    </div>

    <!-- 无尽地图选择 -->
    <div class="overlay" id="endlessSelect">
      <h1 style="font-size:28px">♾️ 无尽挑战</h1>
      <div class="sub">选择战场地形 · 波次与强度无限成长</div>
      <div id="endlessList"></div>
      <button class="act warn" style="width:210px" onclick="closeEndlessSelect()">返回选关</button>
    </div>

    <!-- 天赋 -->
    <div class="overlay" id="talent">
      <h1 style="font-size:28px">⭐ 转生天赋</h1>
      <div class="sub" id="talStars">星尘: 0</div>
      <div id="talList"></div>

    <!-- 结算 -->
    <div class="overlay" id="over">

      <div class="sub" id="overSub"></div>
      <div class="settle-grid" id="overStats"></div>
      <div class="achievement-list" id="overAchievements"></div>
      <div class="row" style="width:100%;max-width:520px;flex-wrap:wrap" id="overBtns"></div>
    </div>

    <!-- 本地无尽排行榜 -->
    <div class="overlay" id="leaderboard">
      <h1 style="font-size:28px">🏅 无尽战绩</h1>
      <div class="sub" id="rankSub">仅保存在本机浏览器</div>
      <div id="rankList"></div>

    </div>
  </div>

  <div id="panel">
    <div class="card">
      <h3>建造塔 <span style="float:right;font-weight:400;text-transform:none">选塔→点空地放1个</span></h3>
      <div id="shop"></div>
    </div>

      <div class="card" id="sel">

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TOP = 46, CELL = 40;
const CD_FLOOR = 0.08, RANGE_CAP = 260;   // 无尽升级软上限，防数值畸形

// ========== 声音系统（CC0 素材，设置独立持久化）==========
const AUDIO_PREF_KEY='xingui_audio_v1';
const AUDIO_ASSETS={
  arrow:'assets/audio/arrow-shot.mp3', cannon:'assets/audio/cannon-blast.mp3',
  frost:'assets/audio/frost-pulse.mp3', laser:'assets/audio/laser-beam.mp3',
  build:'assets/audio/tower-build.mp3', boss:'assets/audio/boss-alert.mp3',
  ui:'assets/audio/ui-click.mp3', upgrade:'assets/audio/upgrade.mp3', evolution:'assets/audio/evolution.mp3'
};
function loadAudioPrefs(){
  const d={bgm:.28,sfx:.68,muted:false};
  try{
    const s=JSON.parse(localStorage.getItem(AUDIO_PREF_KEY));
    if(s&&typeof s==='object'){
      if(Number.isFinite(+s.bgm))d.bgm=Math.max(0,Math.min(1,+s.bgm));
      if(Number.isFinite(+s.sfx))d.sfx=Math.max(0,Math.min(1,+s.sfx));
      d.muted=!!s.muted;
    }
  }catch(e){}
  return d;
}
let audioPrefs=loadAudioPrefs();
const bgm=new Audio('assets/audio/star-pulse.mp3');
bgm.loop=true; bgm.preload='auto'; bgm.volume=audioPrefs.muted?0:audioPrefs.bgm;
const SfxAudioContext=window.AudioContext||window.webkitAudioContext;
const sfxBuffers={}, sfxLoads={}, sfxLast={}, sfxActiveCount={}, activeSfx=new Set();
const SFX_ACTIVE_LIMIT={arrow:2,cannon:3,frost:2,laser:2,boss:1,build:2,ui:2,upgrade:2,evolution:2};
const MAX_ACTIVE_SFX=10;
let sfxContext=null, sfxMaster=null, sfxWarmPromise=null;
function persistAudio(){ try{ localStorage.setItem(AUDIO_PREF_KEY,JSON.stringify(audioPrefs)); }catch(e){} }
function ensureSfxContext(){
  if(!SfxAudioContext)return null;
  if(!sfxContext){
    sfxContext=new SfxAudioContext({latencyHint:'interactive'});
    sfxMaster=sfxContext.createGain();
    sfxMaster.gain.value=audioPrefs.muted?0:audioPrefs.sfx;
    sfxMaster.connect(sfxContext.destination);
  }
  if(sfxContext.state==='suspended')sfxContext.resume().catch(()=>{});
  return sfxContext;
}
function loadSfx(id){
  if(sfxBuffers[id])return Promise.resolve(sfxBuffers[id]);
  if(sfxLoads[id])return sfxLoads[id];
  const ac=ensureSfxContext();
  if(!ac||!AUDIO_ASSETS[id])return Promise.resolve(null);
  sfxLoads[id]=fetch(AUDIO_ASSETS[id]).then(r=>{
    if(!r.ok)throw new Error('音效加载失败');
    return r.arrayBuffer();
  }).then(data=>ac.decodeAudioData(data)).then(buffer=>{
    sfxBuffers[id]=buffer; return buffer;
  }).catch(()=>null);
  return sfxLoads[id];
}
function warmSfx(){
  if(!ensureSfxContext())return;
  if(!sfxWarmPromise){
    const order=['ui','build','arrow','cannon','frost','laser','upgrade','evolution','boss'];
    sfxWarmPromise=order.reduce((job,id)=>job.then(()=>loadSfx(id)),Promise.resolve());
  }
  return sfxWarmPromise;
}
function stopActiveSfx(){
  for(const source of activeSfx){ try{ source.stop(); }catch(e){} }
  activeSfx.clear();
  for(const id of Object.keys(sfxActiveCount))sfxActiveCount[id]=0;
}
function playSfx(id,gain=1,rate=1,minGap=0){
  if(document.hidden||audioPrefs.muted||audioPrefs.sfx<=0||!AUDIO_ASSETS[id])return;
  const now=performance.now();
  if(now-(sfxLast[id]||0)<minGap)return;
  const ac=ensureSfxContext(), buffer=sfxBuffers[id];
  if(!ac||!buffer){ loadSfx(id); return; }
  if(activeSfx.size>=MAX_ACTIVE_SFX||(sfxActiveCount[id]||0)>=(SFX_ACTIVE_LIMIT[id]||2))return;
  sfxLast[id]=now;
  const source=ac.createBufferSource(), level=ac.createGain();
  source.buffer=buffer;
  source.playbackRate.value=Math.max(.55,Math.min(1.8,rate));
  level.gain.value=Math.max(0,Math.min(1,gain));
  source.connect(level); level.connect(sfxMaster);
  activeSfx.add(source);
  sfxActiveCount[id]=(sfxActiveCount[id]||0)+1;
  source.onended=()=>{

function applyAudioPrefs(){

  stars:0, tal:{atk:0,gold:0,fort:0,idle:0,greed:0},
  bestScore:[0,0,0,0], bestWave:[0,0,0,0], endlessRuns:[]
}; }
function loadSave(){
  const d=defSave();
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s || typeof s!=='object') return d;
    if(Number.isFinite(+s.stars)) d.stars=Math.max(0,Math.floor(+s.stars));
    if(s.tal && typeof s.tal==='object'){
      for(const id of Object.keys(d.tal)){
        if(Number.isFinite(+s.tal[id])) d.tal[id]=Math.max(0,Math.floor(+s.tal[id]));
      }
    }
    for(const key of ['bestScore','bestWave']){
      if(Array.isArray(s[key])) d[key]=d[key].map((v,i)=>Number.isFinite(+s[key][i])?Math.max(0,Math.floor(+s[key][i])):v);
    }
    if(Array.isArray(s.endlessRuns)) d.endlessRuns=s.endlessRuns.filter(r=>r&&typeof r==='object').slice(0,100).map(r=>({
      id:String(r.id||''), time:String(r.time||''), mapIndex:Math.max(0,Math.min(3,Math.floor(+r.mapIndex)||0)),
      mapName:String(r.mapName||'未知战场'), wave:Math.max(0,Math.floor(+r.wave)||0), score:Math.max(0,Math.floor(+r.score)||0),
      kills:Math.max(0,Math.floor(+r.kills)||0), leaks:Math.max(0,Math.floor(+r.leaks)||0), duration:Math.max(0,+r.duration||0),

      reason:String(r.reason||'defeat'), achievements:Array.isArray(r.achievements)?r.achievements.map(String).slice(0,12):[]
    }));
  }catch(e){}

}

function buildWave(n){
  const q=[], rawCount=6+Math.floor(n*1.6), count=state.isEndless?Math.min(72,rawCount):rawCount;
  // 无尽后期把“怪海”折算为血量与单怪奖励，避免实体无限增长拖慢画面
  const overflow=Math.max(0,rawCount-count), hpRate=state.isEndless?1.205:1.22;
  const baseHp=22*Math.pow(hpRate,n-1)*(1+overflow*.03), speed=42+Math.min(n,state.isEndless?60:n)*1.1;
  const rewardScale=rawCount/count;
  for(let i=0;i<count;i++){
    let type='normal', hp=baseHp, sp=speed, r=11, col='#ff6b8a', gold=8, leak=1;
    if(n%5===0 && i===count-1){ type='boss'; hp=baseHp*10; sp=speed*0.7; r=20; col='#ff3d6e'; gold=60; leak=5; }
    else if(n>=3 && i%4===0){ type='fast'; hp=baseHp*0.6; sp=speed*1.7; r=8; col='#ffd166'; gold=10; }
    else if(n>=4 && i%5===2){ type='tank'; hp=baseHp*2.4; sp=speed*0.75; r=15; col='#c56bff'; gold=16; leak=2; }
    q.push({type,hp,sp,r,col,gold:Math.round(gold*rewardScale),leak});
  }
  return q;
}
function startWave(){
  if(state.waveActive || state.over) return;
  state.wave++;
  state.spawnQueue = buildWave(state.wave);
  state.spawnTimer = 0; state.waveActive = true;
  syncControls();
  const isBoss = state.wave%5===0;
  if(isBoss)playSfx('boss',.62,.82,600); else playSfx('upgrade',.28,1.08,350);
  banner((winWaves!==Infinity? '第 '+state.wave+' / '+winWaves+' 波':'第 '+state.wave+' 波')+(isBoss?' · BOSS':''), isBoss?'#ff6b8a':'#8fe3b0');
}
function spawnEnemy(def){
  const s=waypoints[0];
  state.enemies.push({ x:s.x, y:s.y, seg:0, t:0,
    hp:def.hp, maxHp:def.hp, sp:def.sp, baseSp:def.sp, slowMul:1,
    r:def.r, col:def.col, gold:def.gold, type:def.type, leak:def.leak||1,
    slowT:0, burnT:0, burnDps:0, poisonT:0, poisonDps:0,
    markT:0, exposeT:0, exposeMult:1, phase:Math.random()*Math.PI*2, dead:false });
}

// ========== 输入 ==========
const mouse={x:-99,y:-99};
cv.addEventListener('mousemove', e=>{
  const r=cv.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
});
cv.addEventListener('click', e=>{
  if(scene!=='play' || state.over) return;
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  if(my<TOP) return;
  const pickRadius=window.matchMedia('(pointer:coarse)').matches?38:18;
  let picked=null, pickedDist=Infinity;
  for(const t of state.towers){
    const d=Math.hypot(t.x-mx,t.y-my);
    if(d<pickRadius && d<pickedDist){ picked=t; pickedDist=d; }
  }
  if(picked){
    playSfx('ui',.28,1.06,45);
    state.selTower=picked; state.selBuild=null; refreshShop(); renderSel(); return;
  }
  if(state.selBuild){
    const cx=Math.floor(mx/CELL), cy=Math.floor((my-TOP)/CELL);
    if(pathSet.has(cx+','+cy)){ flash('不能建在路上'); return; }
    if(state.towers.some(t=>t.cx===cx&&t.cy===cy)){ flash('这里已有塔'); return; }
    const def=TOWERS[state.selBuild];
    if(state.gold<def.cost){ flash('金币不足'); return; }
    state.gold-=def.cost;
    const t={ key:state.selBuild, cx, cy, x:cx*CELL+CELL/2, y:TOP+cy*CELL+CELL/2,
      lvl:1, cd:0, cdMax:def.cd, spent:def.cost, branch:null, evoTier:0, evoPath:null,
      ...JSON.parse(JSON.stringify(def)) };
    state.towers.push(t);
    playSfx('build',.55,.96+Math.random()*.08,80);
    state.selTower=t; state.selBuild=null;   // 放置后自动退出建造模式，省去手动取消
    renderSel(); refreshShop();
  } else { state.selTower=null; renderSel(); }
});
// 右键 / ESC 取消建造选择
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); if(state.selBuild){ state.selBuild=null; refreshShop(); } });
window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ state.selBuild=null; state.selTower=null; refreshShop(); renderSel(); } });

// ========== 商店 ==========
const shop=document.getElementById('shop');
function refreshShop(){
  shop.innerHTML='';
  for(const k of TOWER_KEYS){
    const d=TOWERS[k];
    const b=document.createElement('button');
    b.dataset.tower=k;
    b.className='tower-btn'+(state.selBuild===k?' sel':'');
    b.disabled = state.gold<d.cost;
    b.innerHTML=`<div class="tdot" style="background:${d.color};color:${d.color}"></div>
      <div class="tinfo"><div class="tn">${d.name}</div><div class="tc">${d.desc}</div></div>
      <div class="cost">💰${d.cost}</div>`;
    b.onclick=()=>{ playSfx('ui',.35,1.02,35); state.selBuild=state.selBuild===k?null:k; state.selTower=null; refreshShop(); renderSel(); };
    shop.appendChild(b);
  }
}
function syncShopAvailability(){
  for(const b of shop.querySelectorAll('.tower-btn')){
    const k=b.dataset.tower;
    const disabled=state.gold<TOWERS[k].cost, selected=state.selBuild===k;
    if(b.disabled!==disabled)b.disabled=disabled;
    if(b.classList.contains('sel')!==selected)b.classList.toggle('sel',selected);
  }
}

// ========== 选中塔面板 ==========
function upgradeCost(t){ return Math.round(t.spent*0.8); }
function evolutionLine(t){ return t.branch&&EVOLUTIONS[t.key]&&EVOLUTIONS[t.key][t.branch]; }
function chosenEvolution(t){ const line=evolutionLine(t); return line&&line.find(x=>x.id===t.evoPath); }
function pendingEvolution(t){
  const line=evolutionLine(t); if(!line)return null;
  if(t.lvl>=6 && (t.evoTier||1)<2)return {kind:'choice',choices:line};
  const route=chosenEvolution(t);
  if(t.lvl>=9 && (t.evoTier||1)<3&&route)return {kind:'final',route,evo:route.final};
  return null;
}
function towerDisplayName(t){
  if(!t.branch)return t.name;
  const br=BRANCHES[t.key].find(x=>x.id===t.branch), route=chosenEvolution(t), tier=t.evoTier||1;
  return tier>=3&&route?route.final.name:tier>=2&&route?route.name:br.name;
}
function renderSel(){
  const body=document.getElementById('selBody');
  const t=state.selTower;
  if(!t){ body.innerHTML='<div id="selEmpty">点击地图上已有的塔<br>升级 / 选择分支 / 出售。</div>'; return; }
  const sell=Math.round(t.spent*0.6);
  const nameLine=`${t.name}${t.branch?' · '+towerDisplayName(t):''} · Lv.${t.lvl}`;
  let html=`
    <div class="selrow"><span>${nameLine}</span><b style="color:${t.color}">●</b></div>
    <div class="selrow"><span>伤害</span><b>${t.dmg.toFixed(0)}</b></div>
    <div class="selrow"><span>射程</span><b>${t.range.toFixed(0)}</b></div>
    <div class="selrow"><span>攻速</span><b>${(1/t.cdMax).toFixed(2)}/s</b></div>`;
  if(t.splash) html+=`<div class="selrow"><span>影响范围</span><b>${Math.round(t.splash)}</b></div>`;
  if(t.pierce) html+=`<div class="selrow"><span>额外目标</span><b>${t.pierce}</b></div>`;
  if(t.burnRatio) html+=`<div class="selrow"><span>持续灼烧</span><b>${Math.round(t.burnRatio*100)}%</b></div>`;
  if(t.poisonRatio) html+=`<div class="selrow"><span>叠加毒素</span><b>${Math.round(t.poisonRatio*100)}%</b></div>`;
  if(t.bossMult>1) html+=`<div class="selrow"><span>BOSS伤害</span><b>×${t.bossMult.toFixed(2)}</b></div>`;
  if(t.auraSlow) html+=`<div class="selrow"><span>领域减速</span><b>${Math.round((1-t.auraSlow)*100)}%</b></div>`;
  if(t.lvl>=3 && !t.branch){
    // 分支选择
    html+=`<div class="branchTip">⚡ 选择进化分支(免费,不可更改)</div>`;
    BRANCHES[t.key].forEach((br,i)=>{
      html+=`<button class="branch-btn" data-br="${i}"><div class="bn" style="color:${br.color}">${br.name}</div><div class="bd">${br.desc}</div></button>`;
    });
    html+=`<button class="act warn" id="btnSell" style="margin-top:6px">出售 +${sell}</button>`;
    body.innerHTML=html;
    body.querySelectorAll('.branch-btn').forEach(btn=>{
      btn.onclick=()=>chooseBranch(t, +btn.dataset.br);
    });
  } else if(pendingEvolution(t)) {
    const pending=pendingEvolution(t);
    if(pending.kind==='choice'){
      html+=`<div class="branchTip">✦ 二级分支二选一（不可更改）</div>`;
      pending.choices.forEach((evo,i)=>{
        html+=`<button class="branch-btn" data-evo="${i}"><div class="bn" style="color:${evo.color}">${evo.name}</div>
          <div class="bd">${evo.desc}<br><span style="color:${evo.final.color}">Lv.9 → ${evo.final.name}</span></div></button>`;
      });
      html+=`<button class="act warn" id="btnSell" style="margin-top:6px">出售 +${sell}</button>`;
      body.innerHTML=html;
      body.querySelectorAll('[data-evo]').forEach(btn=>btn.onclick=()=>chooseEvolution(t,+btn.dataset.evo));
    }else{
      const evo=pending.evo;
      html+=`<div class="branchTip">✦ 终极进化已就绪</div>
        <button class="branch-btn" id="btnEvolve"><div class="bn" style="color:${evo.color}">${evo.name}</div><div class="bd">${evo.desc} · 免费进化</div></button>
        <button class="act warn" id="btnSell" style="margin-top:6px">出售 +${sell}</button>`;
      body.innerHTML=html;
      document.getElementById('btnEvolve').onclick=()=>evolveTower(t);
    }
  } else {
    const uc=upgradeCost(t);
    html+=`<div class="row" style="margin-top:8px">
      <button class="act" id="btnUp" ${state.gold<uc?'disabled':''}>升级 💰${uc}</button>
      <button class="act warn" id="btnSell">出售 +${sell}</button></div>`;
    const next=t.lvl<3?3:t.lvl<6?6:t.lvl<9?9:null;
    if(next) html+=`<div class="hint" style="color:#ffd76b">再升 ${next-t.lvl} 级解锁${next===3?'主路线选择':next===6?'二级分支':'终极进化'}</div>`;
    else html+=`<div class="hint">路线已完全体，仍可继续强化基础数值。</div>`;
    body.innerHTML=html;
    document.getElementById('btnUp').onclick=()=>{
      const c=upgradeCost(t);
      if(state.gold<c)return;
      state.gold-=c; t.spent+=c; t.lvl++;
      t.dmg*=1.32; t.range=Math.min(t.range+8,RANGE_CAP); t.cdMax=Math.max(t.cdMax*0.93,CD_FLOOR);
      playSfx('upgrade',.58,1+Math.min(.22,t.lvl*.012),70);
      renderSel(); refreshShop();
    };
  }
  document.getElementById('btnSell').onclick=()=>{
    playSfx('ui',.42,.72,45);
    state.gold+=sell; state.towers=state.towers.filter(x=>x!==t);
    state.selTower=null; renderSel(); refreshShop();
  };
}
function chooseBranch(t, i){
  const br=BRANCHES[t.key][i];
  t.branch=br.id; t.evoTier=1; t.evoPath=null; br.apply(t);
  floatText(t.x,t.y-18,'▲ '+br.name, br.color);
  spawnBurst(t.x,t.y,br.color,16);
  playSfx('evolution',.72,1.02,90);
  renderSel(); refreshShop();
}
function chooseEvolution(t,i){
  const route=evolutionLine(t)[i]; if(!route||t.evoTier>=2)return;
  t.evoPath=route.id; t.evoTier=2; route.apply(t); t.color=route.color; t.bullet=route.color;
  floatText(t.x,t.y-18,'◆ '+route.name,route.color); spawnBurst(t.x,t.y,route.color,24); ring(t.x,t.y,32,route.color);
  playSfx('evolution',.82,1.16,90);
  renderSel(); refreshShop();
}
function evolveTower(t){
  const pending=pendingEvolution(t); if(!pending||pending.kind!=='final')return;
  const evo=pending.evo; t.evoTier=3; evo.apply(t); t.color=evo.color; t.bullet=evo.color;
  floatText(t.x,t.y-18,'✦ '+evo.name,evo.color);
  spawnBurst(t.x,t.y,evo.color,t.evoTier===3?30:22); ring(t.x,t.y,t.evoTier===3?38:30,evo.color);
  playSfx('evolution',.95,1.32,90); playSfx('frost',.32,.78,90);
  renderSel(); refreshShop();
}

// ========== 控制按钮 ==========
const btnAuto=document.getElementById('btnAuto'), btnWave=document.getElementById('btnWave'),
  btnSpeed=document.getElementById('speed'), btnPause=document.getElementById('btnPause');
function syncControls(){
  const locked=scene!=='play'||state.over;
  btnAuto.textContent='自动开波: '+(state.autoWave?'开':'关');
  btnAuto.classList.toggle('sec',state.autoWave);
  btnSpeed.textContent='⏩ ×'+state.speed;
  btnSpeed.classList.toggle('on',state.speed>1);
  btnPause.textContent=state.paused?'▶ 继续':'⏸ 暂停';
  btnPause.classList.toggle('warn',state.paused);
  btnAuto.disabled=locked;
  btnSpeed.disabled=locked;
  btnPause.disabled=locked;
  btnWave.disabled=locked||state.paused||state.waveActive;
}
btnAuto.onclick=()=>{
  if(scene!=='play'||state.over)return;
  playSfx('ui',.3,state.autoWave ? .88 : 1.08,35);
  state.autoWave=!state.autoWave; syncControls();
};
btnWave.onclick=()=>{
  if(scene==='play'&&!state.paused&&!state.waveActive&&!state.over){ playSfx('ui',.32,1.1,35); state.betweenTimer=0; startWave(); syncControls(); }
};
btnSpeed.onclick=()=>{
  if(scene!=='play'||state.over)return;
  playSfx('ui',.28,1+.1*(state.speed===1?1:state.speed===2?2:0),35);
  state.speed=state.speed===1?2:state.speed===2?4:1; syncControls();
};
btnPause.onclick=()=>{
  if(scene!=='play'||state.over)return;
  state.paused=!state.paused;
  playSfx('ui',.35,state.paused?.78:1.08,35);
  if(state.paused){ bannerT=0; document.getElementById('banner').style.opacity=0; pauseBgm(false); stopActiveSfx(); }
  else { banner('继续作战','#8fe3b0'); startBgm(false); }
  syncControls();
};

// ========== 提示 ==========
let bannerT=0;
function banner(txt,col){ const b=document.getElementById('banner'); b.textContent=txt; b.style.color=col||'#fff'; b.style.opacity=1; bannerT=1.4; }
function flash(txt){ playSfx('ui',.3,.7,120); banner(txt,'#ff9d9d'); bannerT=0.9; }
function floatText(x,y,txt,col){ state.floats.push({x,y,txt,col,life:0.9}); }

// ========== 循环 ==========
let last=performance.now();
function loop(now){
  let dt=Math.min((now-last)/1000,0.05); last=now;
  clock=now/1000;
  if(scene==='play' && !state.over && !state.paused){
    for(let i=0;i<state.speed;i++){
      update(dt);
      if(state.over||state.paused)break;
    }
    syncHud();
  }
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  state.time+=dt;
  // 挂机产金
  state.idleAcc+=dt;
  if(state.idleAcc>=1){ const g=Math.max(1,Math.round((2+state.wave*0.5)*IDLE_MULT)); state.gold+=g; state.idleAcc-=1;
    document.getElementById('idle').textContent='挂机产金 +'+g+'/s'; syncShopAvailability(); }

  // 波次调度
  if(state.waveActive){
    if(state.spawnQueue.length){
      state.spawnTimer-=dt;
      if(state.spawnTimer<=0){ spawnEnemy(state.spawnQueue.shift()); state.spawnTimer=Math.max(.28,.7-state.wave*.008); }
    } else if(state.enemies.length===0){
      state.waveActive=false;
      const bonus=15+state.wave*4; state.gold+=bonus; state.score+=state.wave*10;
      floatText(W/2,H/2,'波次奖励 +'+bonus,'#ffd76b'); syncShopAvailability();
      playSfx('upgrade',.38,1.18,350);
      if(winWaves!==Infinity && state.wave>=winWaves){ victory(); return; }
      state.betweenTimer = state.autoWave?3:99999;
      syncControls();
    }
  } else {
    if(state.autoWave){
      state.betweenTimer-=dt;
      if(state.betweenTimer<=0) startWave();
    }
  }

  // 敌人
  for(const e of state.enemies){
    if(e.dead) continue;
    if(e.burnT>0){ e.burnT-=dt; e.hp-=e.burnDps*dt;
      if(e.hp<=0){ killEnemy(e); continue; } }
    if(e.poisonT>0){ e.poisonT-=dt; e.hp-=e.poisonDps*dt;
      if(e.hp<=0){ killEnemy(e); continue; } if(e.poisonT<=0)e.poisonDps=0; }
    e.markT=Math.max(0,(e.markT||0)-dt); e.exposeT=Math.max(0,(e.exposeT||0)-dt);
    if(e.exposeT<=0)e.exposeMult=1;
    e.slowT=Math.max(0,e.slowT-dt);
    let auraMul=1;
    for(const t of state.towers){ if(t.auraSlow&&Math.hypot(e.x-t.x,e.y-t.y)<=t.range)auraMul=Math.min(auraMul,t.auraSlow); }
    if(e.type==='boss')auraMul=Math.max(auraMul,.75);
    const statusMul=e.slowT>0?e.slowMul:1, sp=e.baseSp*Math.min(statusMul,auraMul);
    let move=sp*dt;
    while(move>0 && e.seg<waypoints.length-1){
      const a=waypoints[e.seg], b=waypoints[e.seg+1];
      const L=segLen(a,b), remain=L*(1-e.t);
      if(move<remain){ e.t+=move/L; move=0; } else { move-=remain; e.seg++; e.t=0; }
    }
    const a=waypoints[Math.min(e.seg,waypoints.length-1)], b=waypoints[Math.min(e.seg+1,waypoints.length-1)];
    e.x=a.x+(b.x-a.x)*e.t; e.y=a.y+(b.y-a.y)*e.t;
    if(e.seg>=waypoints.length-1){
      e.dead=true; state.hp=Math.max(0,state.hp-e.leak); state.leaks++;
      floatText(e.x,e.y,'-'+e.leak+'❤️','#ff6b6b'); spawnBurst(e.x,e.y,e.col,8);
      playSfx('boss',e.type==='boss' ? .62 : .22,e.type==='boss' ? .72 : 1.25,420);
      if(state.hp<=0){ gameOver(); return; }
    }
  }

  // 塔攻击
  for(const t of state.towers){
    t.cd-=dt;
    if(t.cd>0) continue;
    let target=null, best=-1;
    for(const e of state.enemies){
      if(e.dead)continue;
      const d=Math.hypot(e.x-t.x,e.y-t.y);
      if(d<=t.range){ const prog=e.seg+e.t+(t.bossMult&&e.type==='boss'?1000:0); if(prog>best){best=prog;target=e;} }
    }
    if(target){
      t.cd=t.cdMax;
      let dmg=t.dmg*DMG_MULT, crit=false;
      if(t.crit && Math.random()<(t.critChance||.3)){ dmg*=t.crit; crit=true; }
      if(target.markT>0&&t.markMult)dmg*=t.markMult;
      if(target.type==='boss'&&t.bossMult)dmg*=t.bossMult;
      state.bullets.push({ x:t.x,y:t.y, tx:target, sp:540, dmg, crit, col:t.bullet,
        splash:t.splash||0, splashFactor:t.splashFactor||.5, splashSlow:!!t.splashSlow,
        splashSlowDur:t.splashSlowDur||1.4, splashSlowMul:t.splashSlowMul||.5, splashBurn:!!t.splashBurn,
        slow:t.slow||0, slowDur:t.slowDur||0, freeze:t.freeze||0, freezeDur:t.freezeDur||1.2,
        burn:t.burnRatio?dmg*t.burnRatio:0, burnDur:t.burnDur||0,
        poison:t.poisonRatio?dmg*t.poisonRatio:0, poisonDur:t.poisonDur||0, poisonSpread:!!t.poisonSpread,
        execute:t.execute||0, markDur:t.markDur||0, expose:t.expose||0,
        brittle:t.brittle||0, brittleDur:t.brittleDur||0,
        clusterCount:t.clusterCount||0, clusterFactor:t.clusterFactor||0,
        pierce:t.pierce||0, chainRange:t.chainRange||95, hitset:new Set() });
      playTowerShot(t);
      spawnMuzzle(t);
    }
  }

  // 子弹
  for(const b of state.bullets){
    if(!b.tx || b.tx.dead){ b.dead=true; continue; }
    const dx=b.tx.x-b.x, dy=b.tx.y-b.y, d=Math.hypot(dx,dy), mv=b.sp*dt;
    if(d<=mv+b.tx.r){
      hitEnemy(b, b.tx); b.hitset.add(b.tx);
      if(b.pierce>0){
        let nx=null,nd=1e9;
        for(const e of state.enemies){ if(e.dead||b.hitset.has(e))continue;
          const dd=Math.hypot(e.x-b.tx.x,e.y-b.tx.y); if(dd<b.chainRange&&dd<nd){nd=dd;nx=e;} }
        if(nx){ b.pierce--; b.tx=nx; } else b.dead=true;
      } else b.dead=true;
    } else { b.x+=dx/d*mv; b.y+=dy/d*mv; }
  }
  state.bullets=state.bullets.filter(b=>!b.dead);

  // 粒子/浮字
  for(const p of state.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt; }
  state.particles=state.particles.filter(p=>p.life>0);
  for(const f of state.floats){ f.y-=26*dt; f.life-=dt; }
  state.floats=state.floats.filter(f=>f.life>0);
  state.enemies=state.enemies.filter(e=>!e.dead);

  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) document.getElementById('banner').style.opacity=0; }
}

function hitEnemy(b, e){
  damage(e, b.dmg, b.col, b.crit);
  if(!e.dead){
    if(b.freeze && Math.random()<b.freeze)applySlow(e,b.freezeDur,.05);
    else if(b.slow>0)applySlow(e,b.slowDur,b.slow);
    if(b.burn>0){ e.burnDps=b.burn; e.burnT=b.burnDur; }
    if(b.poison>0){ e.poisonDps=Math.min((e.poisonDps||0)+b.poison,b.poison*3); e.poisonT=b.poisonDur; }
    if(b.markDur){ e.markT=Math.max(e.markT||0,b.markDur); }
    if(b.expose>1){ e.exposeMult=Math.max(e.exposeMult||1,b.expose); e.exposeT=Math.max(e.exposeT||0,b.markDur); }
    if(b.brittle>1){ e.exposeMult=Math.max(e.exposeMult||1,b.brittle); e.exposeT=Math.max(e.exposeT||0,b.brittleDur); }
    if(b.execute&&e.hp/e.maxHp<=b.execute){ floatText(e.x,e.y-10,'处决','#c6ff73'); damage(e,e.hp+1,b.col); }
  }
  spawnBurst(b.x,b.y,b.col,5);
  if(b.splash>0){
    for(const o of state.enemies){ if(o===e||o.dead)continue;
      if(Math.hypot(o.x-e.x,o.y-e.y)<=b.splash){ damage(o,b.dmg*b.splashFactor,b.col);
        if(b.splashSlow&&!o.dead)applySlow(o,b.splashSlowDur,b.splashSlowMul);
        if(b.splashBurn&&!o.dead){ o.burnDps=b.burn; o.burnT=b.burnDur; } } }
    ring(e.x,e.y,b.splash,b.col);
  }
  if(b.poisonSpread){
    for(const o of state.enemies){ if(o===e||o.dead)continue;
      if(Math.hypot(o.x-e.x,o.y-e.y)<=52){ o.poisonDps=Math.max(o.poisonDps||0,b.poison*.55); o.poisonT=Math.max(o.poisonT||0,b.poisonDur*.7); } }
    ring(e.x,e.y,52,'#a8ef65');
  }
  if(b.clusterCount){
    const near=state.enemies.filter(o=>o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<=Math.max(70,b.splash*1.55));
    for(let i=0;i<b.clusterCount&&near.length;i++){
      const o=near.splice(Math.floor(Math.random()*near.length),1)[0]; damage(o,b.dmg*b.clusterFactor,b.col); spawnBurst(o.x,o.y,b.col,4);
    }
  }
}
function applySlow(e,dur,mul){
  if(e.type==='boss'){ dur*=.4; mul=Math.max(.45,mul); }
  if(e.slowT<=0||mul<e.slowMul)e.slowMul=mul;
  e.slowT=Math.max(e.slowT,dur);
}
function damage(e,dmg,col,crit){
  if(e.dead)return;
  const dealt=dmg*((e.exposeT||0)>0?(e.exposeMult||1):1); e.hp-=dealt;
  if(crit) floatText(e.x,e.y-6,Math.round(dealt)+'!','#ffe08a');
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  if(e.dead) return;
  e.dead=true; const g=Math.round(e.gold*GREED_MULT);
  state.gold+=g; state.score+=e.gold; state.kills++;
  floatText(e.x,e.y,'+'+g,'#ffd76b'); spawnBurst(e.x,e.y,e.col,14); syncShopAvailability();
}

// ========== 粒子 ==========
function spawnBurst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=40+Math.random()*120;
  state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.3,col,r:1.5+Math.random()*2}); } }
function spawnMuzzle(t){ for(let i=0;i<3;i++){ const a=Math.random()*6.28,s=30+Math.random()*40;
  state.particles.push({x:t.x,y:t.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.2,col:t.bullet,r:1.5}); } }
function ring(x,y,r,col){ state.particles.push({ring:true,x,y,r,max:r,life:0.35,col}); }

// ========== 绘制 ==========
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  if(scene==='play'){
    drawPath();
    if(state.selBuild) drawBuildPreview();
    if(state.selTower){ const t=state.selTower;
      ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,6.28);
      ctx.fillStyle=hexA(t.color,0.08); ctx.fill();
      ctx.strokeStyle=hexA(t.color,0.5); ctx.lineWidth=1.5; ctx.stroke(); }
    for(const e of state.enemies) drawEnemy(e);
    for(const t of state.towers) drawTower(t);
    for(const b of state.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,b.crit?4.5:3.5,0,6.28);
      ctx.fillStyle=b.col; ctx.shadowColor=b.col; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0; }
    for(const p of state.particles){
      if(p.ring){ const k=1-p.life/0.35; ctx.beginPath(); ctx.arc(p.x,p.y,p.max*(0.4+k),0,6.28);
        ctx.strokeStyle=hexA(p.col,1-k); ctx.lineWidth=2; ctx.stroke(); continue; }
      ctx.globalAlpha=Math.max(0,p.life*2); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28);
      ctx.fillStyle=p.col; ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    for(const f of state.floats){ ctx.globalAlpha=Math.min(1,f.life*1.6); ctx.fillStyle=f.col;
      ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; }
    ctx.textAlign='left';
    if(state.paused){
      ctx.fillStyle='rgba(5,8,18,.56)'; ctx.fillRect(0,TOP,W,H-TOP);
      ctx.fillStyle='#ffe08a'; ctx.font='800 30px sans-serif'; ctx.textAlign='center';
      ctx.fillText('已暂停',W/2,H/2-4);
      ctx.fillStyle='#c9d4ee'; ctx.font='13px sans-serif'; ctx.fillText('点击「继续」返回战场',W/2,H/2+24);
      ctx.textAlign='left';
    }
  }
}
function drawBackground(){
  // 深空渐变
  const g=ctx.createLinearGradient(0,TOP,0,H);
  g.addColorStop(0,'#0d1636'); g.addColorStop(0.55,'#0a1026'); g.addColorStop(1,'#070a16');
  ctx.fillStyle=g; ctx.fillRect(0,TOP,W,H-TOP);
  // 星云晕染（两团柔光）
  const neb=(cx,cy,rad,col)=>{ const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=rg; ctx.fillRect(0,TOP,W,H-TOP); };
  neb(W*0.24, TOP+H*0.22, 220, 'rgba(90,120,255,.10)');
  neb(W*0.78, TOP+H*0.72, 240, 'rgba(180,90,220,.09)');
  // 星辰闪烁
  for(const s of stars){
    const a=0.22+0.78*Math.abs(Math.sin(clock*s.sp+s.ph));
    ctx.globalAlpha=a;
    if(s.big){ ctx.fillStyle='#cfe6ff'; ctx.shadowColor='#8fd8ff'; ctx.shadowBlur=6; }
    else { ctx.fillStyle='#c7d6f2'; ctx.shadowBlur=0; }
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  // 极淡网格（辅助放置）
  ctx.strokeStyle='rgba(90,120,190,.045)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=CELL){ ctx.beginPath(); ctx.moveTo(x,TOP); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=TOP;y<=H;y+=CELL){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function drawPath(){
  ctx.lineJoin='round'; ctx.lineCap='round';
  const trace=()=>{ ctx.beginPath(); waypoints.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); };
  // 外发光
  ctx.shadowColor='rgba(108,170,255,.55)'; ctx.shadowBlur=16;
  ctx.strokeStyle='rgba(50,80,150,.45)'; ctx.lineWidth=30; trace();
  ctx.shadowBlur=0;
  // 内芯
  ctx.strokeStyle='rgba(120,160,235,.28)'; ctx.lineWidth=22; trace();
  // 流动光带（指示前进方向）
  ctx.strokeStyle='rgba(170,215,255,.55)'; ctx.lineWidth=3;
  ctx.setLineDash([10,16]); ctx.lineDashOffset=-clock*40; trace();
  ctx.setLineDash([]);
  glowDot(waypoints[0].x,waypoints[0].y,'#8fe3b0','进');
  glowDot(waypoints[waypoints.length-1].x,waypoints[waypoints.length-1].y,'#ff6b8a','出');
}
function glowDot(x,y,col,txt){
  ctx.beginPath(); ctx.arc(x,y,13,0,6.28); ctx.fillStyle=hexA(col,.25); ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,7,0,6.28); ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#07111e'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,x,y); ctx.textBaseline='alphabetic'; ctx.textAlign='left';
}
function drawBuildPreview(){
  if(mouse.y<TOP) return;
  const cx=Math.floor(mouse.x/CELL), cy=Math.floor((mouse.y-TOP)/CELL);
  const px=cx*CELL+CELL/2, py=TOP+cy*CELL+CELL/2, d=TOWERS[state.selBuild];
  const bad = pathSet.has(cx+','+cy) || state.towers.some(t=>t.cx===cx&&t.cy===cy) || state.gold<d.cost;
  ctx.beginPath(); ctx.arc(px,py,d.range,0,6.28); ctx.fillStyle=hexA(d.color,.07); ctx.fill();
  ctx.strokeStyle=hexA(d.color,.4); ctx.setLineDash([5,5]); ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle= bad?'rgba(255,90,90,.5)':hexA(d.color,.8);
  ctx.fillRect(cx*CELL+6,TOP+cy*CELL+6,CELL-12,CELL-12);
}
function polyPath(x,y,r,sides,rot=-Math.PI/2){
  ctx.beginPath();
  for(let i=0;i<sides;i++){
    const a=rot+i/sides*Math.PI*2, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function diamondPath(x,y,rx,ry){
  ctx.beginPath(); ctx.moveTo(x+rx,y); ctx.lineTo(x,y+ry);
  ctx.lineTo(x-rx,y); ctx.lineTo(x,y-ry); ctx.closePath();
}
function drawEvolutionFX(t,ang,energy){
  const route=chosenEvolution(t); if(!route||(t.evoTier||0)<2)return;
  const fx=route.fx, fin=t.evoTier>=3, r=fin?23:20;
  ctx.save(); ctx.strokeStyle=t.color; ctx.fillStyle=t.color; ctx.lineWidth=fin?1.7:1.25;
  ctx.shadowColor=t.color; ctx.shadowBlur=fin?10:5; ctx.globalAlpha=.72+.2*energy;
  if(fx==='storm'){
    ctx.rotate(clock*1.3); for(let i=0;i<3;i++){ ctx.rotate(Math.PI*2/3); ctx.beginPath();
      ctx.moveTo(8,-2); ctx.lineTo(13,-5); ctx.lineTo(12,1); ctx.lineTo(r,0); ctx.stroke(); }
  }else if(fx==='venom'){
    ctx.rotate(-clock*.65); for(let i=0;i<3;i++){ const a=i*Math.PI*2/3,x=Math.cos(a)*r,y=Math.sin(a)*r;
      ctx.beginPath(); ctx.arc(x,y,fin?3.2:2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x-2,y-1); ctx.lineTo(x+2,y-1); ctx.closePath(); ctx.fill(); }
  }else if(fx==='rail'){
    ctx.rotate(ang); for(const y of [-8,8]){ ctx.beginPath(); ctx.moveTo(-18,y); ctx.lineTo(26,y); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(12,-12); ctx.lineTo(12,12); ctx.stroke();
  }else if(fx==='hunter'||fx==='titan'){
    ctx.rotate(ang); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(r-5,0); ctx.lineTo(r+4,0); ctx.stroke(); }
    if(fx==='titan'){ ctx.beginPath(); ctx.arc(0,0,5+energy*2,0,Math.PI*2); ctx.strokeStyle='#fff'; ctx.stroke(); }
  }else if(fx==='cluster'){
    ctx.rotate(clock*.8); for(let i=0;i<(fin?6:4);i++){ const a=i*Math.PI*2/(fin?6:4);
      ctx.beginPath(); ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2.4,0,Math.PI*2); ctx.fill(); }
  }else if(fx==='gravity'){
    ctx.rotate(clock*.45); for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(0,0,r-i*4,6+i*2,i*.75,0,Math.PI*2); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,0,3+energy,0,Math.PI*2); ctx.fillStyle='#090512'; ctx.fill();
  }else if(fx==='napalm'){
    for(let i=0;i<4;i++){ ctx.save(); ctx.rotate(i*Math.PI/2+Math.sin(clock*2)*.1);
      ctx.beginPath(); ctx.moveTo(13,3); ctx.quadraticCurveTo(r+5,-2,15,-8); ctx.quadraticCurveTo(18,-1,13,3); ctx.fill(); ctx.restore(); }
  }else if(fx==='plasma'||fx==='nova'){
    ctx.rotate(clock*(fx==='nova'?-.7:.45)); const n=fx==='nova'?10:8;
    for(let i=0;i<n;i++){ ctx.rotate(Math.PI*2/n); ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(r+(fin?5:1),0); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,0,fin?7:5,0,Math.PI*2); ctx.strokeStyle='#fff'; ctx.stroke();
  }else if(fx==='stasis'){
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    ctx.save(); ctx.rotate(clock*.18); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r+4); ctx.moveTo(0,0); ctx.lineTo(r*.55,0); ctx.stroke(); ctx.restore();
  }else if(fx==='shatter'){
    ctx.rotate(clock*.1); for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.beginPath();
      ctx.moveTo(8,0); ctx.lineTo(13,-3); ctx.lineTo(16,2); ctx.lineTo(r,0); ctx.stroke(); }
  }else if(fx==='hail'){
    ctx.rotate(-clock*.5); for(let i=0;i<(fin?6:4);i++){ const a=i*Math.PI*2/(fin?6:4);
      diamondPath(Math.cos(a)*r,Math.sin(a)*r,2.3,4); ctx.fill(); }
  }else if(fx==='permafrost'){
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(0,0,14+i*4+(Math.sin(clock*2+i)*1.2),0,Math.PI*2); ctx.strokeStyle=hexA(t.color,.62-i*.12); ctx.stroke(); }
  }else if(fx==='prism'){
    ctx.rotate(clock*.55); for(let i=0;i<3;i++){ ctx.rotate(Math.PI*2/3); polyPath(r,0,fin?4.5:3.5,3,Math.PI/2); ctx.stroke(); }
  }else if(fx==='lance'){
    ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r+7,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r+7,0); ctx.lineTo(r, -4); ctx.lineTo(r,4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10,-5); ctx.lineTo(18,-2); ctx.moveTo(-10,5); ctx.lineTo(18,2); ctx.stroke();
  }
  if(fin){ ctx.globalAlpha=.9; ctx.beginPath(); ctx.arc(0,0,2.2+energy,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); }
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
}
function drawTower(t){
  const pulse=1+0.055*Math.sin(clock*3+t.x*.1), selected=t===state.selTower;
  const energy=.62+.38*Math.sin(clock*4.5+t.y*.08);
  let ang=-Math.PI/2, near=null, nd=1e9;
  for(const e of state.enemies){
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d<t.range&&d<nd){nd=d;near=e;}
  }
  if(near)ang=Math.atan2(near.y-t.y,near.x-t.x);

  ctx.save(); ctx.translate(t.x,t.y);
  // 投影、能量光晕与通用八边形底座
  ctx.beginPath(); ctx.ellipse(0,9,15,7,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.34)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,18*pulse,0,Math.PI*2);
  ctx.strokeStyle=selected?'rgba(255,255,255,.9)':hexA(t.color,.2);
  ctx.lineWidth=selected?2.4:1.5; ctx.stroke();
  polyPath(0,0,15,8,Math.PI/8);
  const base=ctx.createRadialGradient(-3,-4,1,0,0,17);
  base.addColorStop(0,'rgba(47,62,100,.98)'); base.addColorStop(.56,'rgba(20,29,53,.98)');
  base.addColorStop(1,'rgba(8,13,28,.98)');
  ctx.fillStyle=base; ctx.fill();
  ctx.strokeStyle=selected?'#fff':hexA(t.color,.68); ctx.lineWidth=selected?2.2:1.25; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,11.5,0,Math.PI*2);
  ctx.strokeStyle=hexA(t.color,.23); ctx.lineWidth=1; ctx.stroke();

  // 进化后增加旋转的分支轨道，远处也能辨认
  if(t.branch){
    ctx.save(); ctx.rotate(clock*.55);
    ctx.setLineDash([4,4]); ctx.lineDashOffset=-clock*5;
    ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2);
    ctx.strokeStyle=hexA(t.color,.78); ctx.lineWidth=1.7; ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
  if((t.evoTier||0)>=2){
    ctx.save(); ctx.rotate(-clock*.9);
    ctx.beginPath(); ctx.arc(0,0,17.5,0,Math.PI*2);
    ctx.strokeStyle=hexA(t.color,.5); ctx.lineWidth=1; ctx.setLineDash([2,5]); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<3;i++){ const a=i*Math.PI*2/3;
      diamondPath(Math.cos(a)*17.5,Math.sin(a)*17.5,2.2,2.2); ctx.fillStyle=t.color; ctx.fill(); }
    ctx.restore();
  }
  if((t.evoTier||0)>=3){
    ctx.save(); ctx.rotate(clock*1.25); ctx.shadowColor=t.color; ctx.shadowBlur=9;
    for(let i=0;i<4;i++){ const a=Math.PI/4+i*Math.PI/2;
      diamondPath(Math.cos(a)*20,Math.sin(a)*20,2.6,4.2); ctx.fillStyle=i%2?'#fff':t.color; ctx.fill(); }
    ctx.shadowBlur=0; ctx.restore();
  }

  if(t.key==='arrow'){
    // 箭塔：轻盈的双翼轨道和明确的箭头轮廓
    ctx.save(); ctx.rotate(ang); ctx.lineJoin='round';
    ctx.shadowColor=t.color; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.moveTo(-8,-7); ctx.lineTo(4,-3.5); ctx.lineTo(15,-3.5);
    ctx.lineTo(18,0); ctx.lineTo(15,3.5); ctx.lineTo(4,3.5); ctx.lineTo(-8,7);
    ctx.lineTo(-4,0); ctx.closePath();
    ctx.fillStyle='rgba(15,29,51,.98)'; ctx.fill();
    ctx.strokeStyle=t.color; ctx.lineWidth=1.8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12,-7); ctx.lineTo(24,0); ctx.lineTo(12,7); ctx.lineTo(16,0); ctx.closePath();
    ctx.fillStyle=t.color; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-1,0); ctx.lineTo(19,0);
    ctx.strokeStyle='rgba(235,249,255,.9)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    diamondPath(0,0,6.5,6.5); ctx.fillStyle=t.color; ctx.fill();
    diamondPath(0,0,2.5,2.5); ctx.fillStyle='#f2fbff'; ctx.fill();
  } else if(t.key==='cannon'){
    // 炮塔：厚重的装甲转盘、双层炮管与深色炮口
    ctx.save(); ctx.rotate(ang); ctx.lineJoin='round';
    polyPath(0,0,9.5,6,Math.PI/6); ctx.fillStyle=hexA(t.color,.82); ctx.fill();
    ctx.strokeStyle='rgba(255,230,205,.72)'; ctx.lineWidth=1.1; ctx.stroke();
    ctx.fillStyle='rgba(16,23,39,.98)'; ctx.fillRect(1,-6.5,18,13);
    ctx.strokeStyle=t.color; ctx.lineWidth=2; ctx.strokeRect(1,-6.5,18,13);
    ctx.fillStyle=t.color; ctx.fillRect(8,-4.6,13,9.2);
    ctx.fillStyle='rgba(255,220,185,.55)'; ctx.fillRect(9,-3.4,10,2);
    ctx.beginPath(); ctx.arc(21,0,6.1,0,Math.PI*2); ctx.fillStyle=t.color; ctx.fill();
    ctx.beginPath(); ctx.arc(21,0,3.5,0,Math.PI*2); ctx.fillStyle='#080b12'; ctx.fill();
    ctx.beginPath(); ctx.arc(21,0,1.4,0,Math.PI*2); ctx.fillStyle=hexA('#ffd6a3',energy); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(0,0,5.5,0,Math.PI*2); ctx.fillStyle='#172039'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,3.3,0,Math.PI*2); ctx.fillStyle=t.color; ctx.fill();
  } else if(t.key==='frost'){
    // 霜塔：独立旋转的六向晶簇，中央冰核周期性闪烁
    ctx.save(); ctx.rotate(clock*.28+t.x*.01);
    ctx.shadowColor=t.color; ctx.shadowBlur=10;
    for(let i=0;i<6;i++){
      ctx.save(); ctx.rotate(i*Math.PI/3);
      diamondPath(9,0,8.5,3.2); ctx.fillStyle=hexA(t.color,.82); ctx.fill();
      ctx.strokeStyle='rgba(235,252,255,.7)'; ctx.lineWidth=.8; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8,-1); ctx.lineTo(15,0); ctx.lineTo(8,1);
      ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur=0; ctx.restore();
    ctx.save(); ctx.rotate(ang);
    diamondPath(14,0,7,2.6); ctx.fillStyle=hexA(t.color,.72); ctx.fill(); ctx.restore();
    diamondPath(0,0,7.2,7.2); ctx.fillStyle=hexA(t.color,.9); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1.1; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,2.6+energy,0,Math.PI*2);
    ctx.fillStyle='#f4fdff'; ctx.shadowColor=t.color; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
  } else {
    // 激光塔：双轨聚能器、旋转线圈与高亮发射镜头
    ctx.save(); ctx.rotate(-clock*.65);
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(0,0,10.5,0,Math.PI*2);
    ctx.strokeStyle=hexA(t.color,.64); ctx.lineWidth=1.5; ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    ctx.save(); ctx.rotate(ang); ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(-5,-7); ctx.lineTo(19,-4); ctx.lineTo(22,-1.5);
    ctx.lineTo(5,-1.5); ctx.closePath(); ctx.fillStyle=hexA(t.color,.68); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5,7); ctx.lineTo(19,4); ctx.lineTo(22,1.5);
    ctx.lineTo(5,1.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2,0); ctx.lineTo(23,0);
    ctx.strokeStyle='rgba(250,235,255,.95)'; ctx.shadowColor=t.color; ctx.shadowBlur=12;
    ctx.lineWidth=1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(23,0,4.4,0,Math.PI*2); ctx.fillStyle=t.color; ctx.fill();
    ctx.beginPath(); ctx.arc(23,0,2.2+energy*.45,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
    ctx.beginPath(); ctx.arc(0,0,6.2,0,Math.PI*2); ctx.fillStyle='#17152c'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,3.5+energy*.35,0,Math.PI*2);
    ctx.fillStyle=t.color; ctx.shadowColor=t.color; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
  }

  drawEvolutionFX(t,ang,energy);

  // 分支核心与等级菱形灯
  if(t.branch){
    ctx.beginPath(); ctx.arc(0,0,1.8,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  const shown=Math.min(t.lvl,9), start=-(shown-1)*1.9;
  for(let i=0;i<shown;i++){
    diamondPath(start+i*3.8,18,1.35,1.9);
    ctx.fillStyle=i<3?'#ffd76b':i<6?t.color:'#fff'; ctx.fill();
  }
  ctx.restore();
}
function drawEnemy(e){
  const pulse=e.type==='boss'?1+.07*Math.sin(clock*4+e.phase):1;
  const rr=e.r*pulse, a=waypoints[Math.min(e.seg,waypoints.length-1)],
    b=waypoints[Math.min(e.seg+1,waypoints.length-1)], ang=Math.atan2(b.y-a.y,b.x-a.x);
  ctx.save(); ctx.translate(e.x,e.y);
  ctx.shadowColor=e.col; ctx.shadowBlur=e.type==='boss'?20:9;
  if(e.type==='fast'){
    // 迅捷体：面向路径的梭形战机，尾翼随速度颤动
    ctx.rotate(ang); ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(rr*1.55,0); ctx.lineTo(rr*.25,-rr*.72); ctx.lineTo(-rr*.35,-rr*.48);
    ctx.lineTo(-rr*1.2,-rr*.85); ctx.lineTo(-rr*.85,0); ctx.lineTo(-rr*1.2,rr*.85);
    ctx.lineTo(-rr*.35,rr*.48); ctx.lineTo(rr*.25,rr*.72); ctx.closePath();
    const fg=ctx.createLinearGradient(-rr,0,rr,0); fg.addColorStop(0,'#7b4e21'); fg.addColorStop(.55,e.col); fg.addColorStop(1,'#fff0a8');
    ctx.fillStyle=fg; ctx.fill(); ctx.strokeStyle='rgba(255,239,180,.85)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-rr*.85,0); ctx.lineTo(-rr*1.55,0);
    ctx.strokeStyle=hexA(e.col,.8); ctx.lineWidth=2+Math.sin(clock*14+e.phase); ctx.stroke();
    diamondPath(rr*.35,0,rr*.32,rr*.25); ctx.fillStyle='#fff8c9'; ctx.fill();
  } else if(e.type==='tank'){
    // 坦克体：厚重八角装甲，四块独立护板
    ctx.rotate(Math.sin(clock*.55+e.phase)*.08);
    polyPath(0,0,rr,8,Math.PI/8); ctx.fillStyle='#35234d'; ctx.fill();
    ctx.strokeStyle=e.col; ctx.lineWidth=2.4; ctx.stroke();
    for(let i=0;i<4;i++){
      ctx.save(); ctx.rotate(i*Math.PI/2); ctx.fillStyle=hexA(e.col,.72);
      ctx.fillRect(rr*.28,-rr*.32,rr*.65,rr*.64); ctx.strokeStyle='rgba(245,220,255,.45)'; ctx.lineWidth=.8; ctx.strokeRect(rr*.28,-rr*.32,rr*.65,rr*.64); ctx.restore();
    }
    polyPath(0,0,rr*.48,6,Math.PI/6); ctx.fillStyle=e.col; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,rr*.2,0,Math.PI*2); ctx.fillStyle='#f3d9ff'; ctx.fill();
  } else if(e.type==='boss'){
    // BOSS：旋转棘轮与双层能量核心
    ctx.rotate(clock*.34+e.phase);
    ctx.beginPath();
    for(let i=0;i<24;i++){ const ar=i*Math.PI/12, rad=i%2?rr*.84:rr*1.28;
      const x=Math.cos(ar)*rad,y=Math.sin(ar)*rad; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath(); ctx.fillStyle='#41122c'; ctx.fill(); ctx.strokeStyle=e.col; ctx.lineWidth=1.8; ctx.stroke();
    ctx.rotate(-clock*.75);
    polyPath(0,0,rr*.75,8,Math.PI/8); ctx.fillStyle=e.col; ctx.fill();
    ctx.strokeStyle='rgba(255,220,232,.8)'; ctx.lineWidth=1.2; ctx.stroke();
    for(let i=0;i<4;i++){ const ar=i*Math.PI/2+clock;
      ctx.beginPath(); ctx.arc(Math.cos(ar)*rr*.52,Math.sin(ar)*rr*.52,rr*.1,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(0,0,rr*.34,0,Math.PI*2); ctx.fillStyle='#180711'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,rr*(.14+.035*Math.sin(clock*6)),0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  } else {
    // 普通体：六棱侦察无人机，保留明确的正面“眼睛”
    ctx.rotate(clock*.18+e.phase*.12);
    polyPath(0,0,rr,6,Math.PI/6); ctx.fillStyle='#4d1730'; ctx.fill();
    ctx.strokeStyle=e.col; ctx.lineWidth=1.8; ctx.stroke();
    for(let i=0;i<3;i++){ ctx.save(); ctx.rotate(i*Math.PI*2/3);
      diamondPath(rr*.7,0,rr*.3,rr*.14); ctx.fillStyle=hexA(e.col,.82); ctx.fill(); ctx.restore(); }
    ctx.rotate(-clock*.18-e.phase*.12);
    diamondPath(0,0,rr*.55,rr*.42); ctx.fillStyle=e.col; ctx.fill();
    ctx.beginPath(); ctx.arc(rr*.12,0,rr*.17,0,Math.PI*2); ctx.fillStyle='#fff1f5'; ctx.fill();
  }
  ctx.shadowBlur=0; ctx.restore();
  if(e.slowT>0){ ctx.beginPath(); ctx.arc(e.x,e.y,e.r+3,0,6.28);
    ctx.strokeStyle= e.slowMul<0.1?'rgba(120,200,255,.95)':'rgba(140,220,255,.7)'; ctx.lineWidth=2; ctx.stroke(); }
  if(e.burnT>0){ ctx.beginPath(); ctx.arc(e.x,e.y,e.r+3,0,6.28); ctx.strokeStyle='rgba(255,120,80,.7)'; ctx.lineWidth=2; ctx.stroke(); }
  if(e.poisonT>0){
    ctx.strokeStyle='rgba(175,255,105,.85)'; ctx.lineWidth=1.6;
    for(let i=0;i<3;i++){ const a=clock*1.8+e.phase+i*Math.PI*2/3;
      ctx.beginPath(); ctx.arc(e.x+Math.cos(a)*(e.r+4),e.y+Math.sin(a)*(e.r+4),2,0,Math.PI*2); ctx.stroke(); }
  }
  if((e.markT||0)>0){
    ctx.strokeStyle=(e.exposeT||0)>0?'#ffe08a':'rgba(255,220,150,.8)'; ctx.lineWidth=1.2;
    const mr=e.r+6; for(let i=0;i<4;i++){ const a=i*Math.PI/2,x=e.x+Math.cos(a)*mr,y=e.y+Math.sin(a)*mr;
      ctx.beginPath(); ctx.moveTo(x-Math.cos(a)*5,y-Math.sin(a)*5); ctx.lineTo(x+Math.cos(a)*3,y+Math.sin(a)*3); ctx.stroke(); }
  }
  const w=e.r*2.2, hpr=Math.max(0,e.hp/e.maxHp);
  ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(e.x-w/2,e.y-rr-10,w,4);
  ctx.fillStyle= hpr>0.5?'#7fe3a0':hpr>0.25?'#ffd166':'#ff6b6b';
  ctx.fillRect(e.x-w/2,e.y-rr-10,w*hpr,4);
  if(e.type==='boss'){
    ctx.fillStyle='#ffd5e2'; ctx.font='800 8px sans-serif'; ctx.textAlign='center';
    ctx.fillText('BOSS',e.x,e.y+rr+12); ctx.textAlign='left';
  }
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

// ========== HUD ==========
function syncHud(){
  document.getElementById('uiHp').textContent=state.hp;
  document.getElementById('uiHp').parentElement.classList.toggle('hp-bad',state.hp<=5);
  document.getElementById('uiGold').textContent=Math.floor(state.gold);
  document.getElementById('uiWave').textContent=state.wave;
  document.getElementById('uiScore').textContent=state.score;
}

// ========== 场景流程 ==========
function buildMenu(){
  const list=document.getElementById('menuList'); list.innerHTML='';
  MAPS.forEach((m,i)=>{
    const bestWave=save.bestWave[i]||0, bestScore=save.bestScore[i]||0;
    const record=bestWave?'· 纪录 '+bestWave+'波 / '+bestScore+'分':'· 暂无纪录';
    const c=document.createElement('button');
    c.className='mapcard';
    c.innerHTML=`<div class="mt">${i+1}. ${m.name}</div>
      <div class="md">${m.desc}</div>
      <div class="mw">目标 ${m.waves} 波 ${record}</div>`;
    c.onclick=()=>startGame(i,false);
    list.appendChild(c);
  });
  const runs=save.endlessRuns||[], best=runs.slice().sort((a,b)=>b.score-a.score||b.wave-a.wave)[0];
  const endless=document.createElement('button'); endless.className='mapcard endless';
  endless.innerHTML=`<div class="mt">♾️ 无尽挑战</div><div class="md">任选四张地图，坚持到极限并记录每次远征。</div>
    <div class="mw">${best?'最高 '+best.wave+' 波 / '+best.score+' 分':'暂无无尽战绩'} · 共 ${runs.length} 局</div>`;
  endless.onclick=()=>openEndlessSelect('menu'); list.appendChild(endless);
  document.getElementById('menu').scrollTop=0;
  document.getElementById('btnTalent').textContent='⭐ 转生天赋 · '+save.stars+' 星尘';
  document.getElementById('btnRank').textContent='🏅 无尽战绩 · '+runs.length+' 局';
}
function openTalent(){ buildTalent(); document.getElementById('menu').classList.remove('show'); document.getElementById('talent').classList.add('show'); document.getElementById('talent').scrollTop=0; }
function closeTalent(){ document.getElementById('talent').classList.remove('show'); buildMenu(); document.getElementById('menu').classList.add('show'); }
function buildTalent(){
  document.getElementById('talStars').innerHTML='星尘 <b style="color:#ffe08a">⭐'+save.stars+'</b> · 每击杀 10 名敌人获得 1,通关额外 +10';
  const list=document.getElementById('talList'); list.innerHTML='';
  TALENTS.forEach(t=>{
    const lv=save.tal[t.id], cost=talCost(t);
    const row=document.createElement('div'); row.className='talrow';
    row.innerHTML=`<div class="ti">${t.icon}</div>
      <div class="tt"><div class="tn">${t.name}<span class="lv">Lv.${lv}</span></div>
      <div class="td">${t.desc} · 当前 ${t.fmt(lv)}</div></div>
      <button class="act tbuy" ${save.stars<cost?'disabled':''}>⭐${cost}</button>`;
    row.querySelector('.tbuy').onclick=()=>{ if(save.stars>=cost){ save.stars-=cost; save.tal[t.id]++; persist(); buildTalent(); } };
    list.appendChild(row);
  });
}
let endlessReturn='menu', leaderboardReturn='menu';
function openEndlessSelect(from='menu'){
  endlessReturn=from; document.getElementById('menu').classList.remove('show');
  document.getElementById('over').classList.remove('show');
  const list=document.getElementById('endlessList'); list.innerHTML='';
  MAPS.forEach((m,i)=>{
    const runs=(save.endlessRuns||[]).filter(r=>r.mapIndex===i), best=runs.slice().sort((a,b)=>b.score-a.score||b.wave-a.wave)[0];
    const c=document.createElement('button'); c.className='mapcard endless';
    c.innerHTML=`<div class="mt">${i+1}. ${m.name}</div><div class="md">${m.desc}</div>
      <div class="mw">${best?'地图纪录 '+best.wave+' 波 / '+best.score+' 分':'尚未远征'} · ${runs.length} 局</div>`;
    c.onclick=()=>startGame(i,true); list.appendChild(c);
  });
  const o=document.getElementById('endlessSelect'); o.classList.add('show'); o.scrollTop=0;
}
function closeEndlessSelect(){
  document.getElementById('endlessSelect').classList.remove('show');
  if(endlessReturn==='over')document.getElementById('over').classList.add('show');
  else { buildMenu(); document.getElementById('menu').classList.add('show'); }
}
function formatDuration(sec){
  const s=Math.max(0,Math.floor(sec||0)), m=Math.floor(s/60), h=Math.floor(m/60);
  return h?`${h}时${m%60}分`:`${m}分${s%60}秒`;
}
function escapeHtml(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openLeaderboard(from='menu'){
  leaderboardReturn=from; document.getElementById('menu').classList.remove('show'); document.getElementById('over').classList.remove('show');
  const runs=(save.endlessRuns||[]).slice().sort((a,b)=>b.score-a.score||b.wave-a.wave||b.kills-a.kills);
  document.getElementById('rankSub').textContent=`本地保存 ${runs.length} 次远征 · 按得分与波次排序`;
  const list=document.getElementById('rankList'); list.innerHTML='';
  if(!runs.length)list.innerHTML='<div class="empty-state">还没有无尽记录，完成一次远征后会自动加入排行榜。</div>';
  runs.forEach((r,i)=>{
    const d=r.time?new Date(r.time):null, ds=d&&!isNaN(d)?d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'未知时间';
    const row=document.createElement('div'); row.className='rankrow';
    row.innerHTML=`<div class="rankpos">${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</div>
      <div class="rankmain"><b>${escapeHtml(r.mapName)} · 第 ${r.wave} 波</b><div class="rankmeta">${ds} · 击杀 ${r.kills} · ${formatDuration(r.duration)}${r.achievements.length?' · '+r.achievements.map(escapeHtml).join(' / '):''}</div></div>
      <div class="rankscore">${r.score}<small style="display:block;color:#7890b8;font-size:9px">分</small></div>`;
    list.appendChild(row);
  });
  const o=document.getElementById('leaderboard'); o.classList.add('show'); o.scrollTop=0;
}
function closeLeaderboard(){
  document.getElementById('leaderboard').classList.remove('show');
  if(leaderboardReturn==='over')document.getElementById('over').classList.add('show');
  else { buildMenu(); document.getElementById('menu').classList.add('show'); }
}
function startGame(idx,endless=false){
  const base=MAPS[idx], active=endless?{...base,name:base.name+' · 无尽',waves:Infinity,endless:true}:base;
  loadMap(active, idx);
  applyTalents();
  state=newState();
  state.gold = 120 + save.tal.gold*40;
  state.hp   = 20  + save.tal.fort*3;
  state.startHp=state.hp; state.isEndless=endless;
  scene='play';
  playSfx('ui',.38,1.12,45);
  toggleAudioPanel(false);
  document.getElementById('wrap').classList.remove('menu-mode','settle-mode');
  for(const id of ['menu','talent','over','endlessSelect','leaderboard'])document.getElementById(id).classList.remove('show');
  document.getElementById('uiMap').textContent=MAP.name;
  document.getElementById('uiWaveMax').textContent = winWaves===Infinity?'/∞':'/'+winWaves;
  document.getElementById('idle').textContent='';
  refreshShop(); renderSel(); syncHud(); syncControls();
  startBgm(true);
  banner(MAP.name, '#8fd8ff');
}
function recordRun(){
  if(mapIndex<0||state.isEndless)return;
  save.bestScore[mapIndex]=Math.max(save.bestScore[mapIndex]||0,state.score);
  save.bestWave[mapIndex]=Math.max(save.bestWave[mapIndex]||0,state.wave);
}
function runAchievements(){
  const a=[], types=new Set(state.towers.map(t=>t.key)), maxLv=Math.max(0,...state.towers.map(t=>t.lvl));
  if(state.kills>=1)a.push('🎯 初次接敌');
  if(state.wave>=10)a.push('🛡️ 十波老兵');
  if(state.wave>=25)a.push('🚀 深空远征');
  if(state.wave>=50)a.push('🌌 星海传奇');
  if(state.wave>=100)a.push('♾️ 百波守望');
  if(state.leaks===0&&state.wave>=10)a.push('💎 完美防线');
  if(types.size===4)a.push('🧭 四象齐聚');
  if(state.towers.some(t=>(t.evoTier||0)>=3))a.push('✦ 终极进化');
  if(state.towers.length>=8)a.push('🏗️ 塔群指挥');
  if(state.gold>=2000)a.push('💰 富甲星海');
  if(maxLv>=12)a.push('⚡ 超限强化');
  return a;
}
function saveEndlessRun(reason,earned,achievements){
  if(state.endlessRecorded)return; state.endlessRecorded=true;
  const maxLevel=Math.max(0,...state.towers.map(t=>t.lvl));
  save.endlessRuns.unshift({ id:Date.now()+'-'+Math.random().toString(36).slice(2,7), time:new Date().toISOString(),
    mapIndex, mapName:MAPS[mapIndex].name, wave:state.wave, score:state.score, kills:state.kills, leaks:state.leaks,
    duration:state.time, towers:state.towers.length, maxLevel, stars:earned, reason, achievements });
  save.endlessRuns=save.endlessRuns.slice(0,100);
}
function showMenu(){
  scene='menu'; state.over=true; pauseBgm(true); stopActiveSfx(); toggleAudioPanel(false); document.getElementById('wrap').classList.remove('settle-mode');
  document.getElementById('wrap').classList.add('menu-mode'); buildMenu();
  for(const id of ['talent','over','endlessSelect','leaderboard'])document.getElementById(id).classList.remove('show');
  document.getElementById('menu').classList.add('show'); syncControls();
}
function backToMenu(){
  if(scene==='play'&&!state.over&&(state.wave>0||state.towers.length>0)){
    const wasPaused=state.paused; state.paused=true; syncControls();
    const msg=state.isEndless?'现在撤离并结算本次无尽远征?':'退出将放弃当前关卡进度,返回选关?';
    if(!window.confirm(msg)){
      state.paused=wasPaused; syncControls(); return;
    }
    if(state.isEndless){ state.paused=wasPaused; endGame(false,'retreat'); return; }
    recordRun(); persist();
  }
  showMenu();
}
function endGame(win,reason='defeat'){
  if(state.over)return;
  state.over=true;
  pauseBgm(false); stopActiveSfx();
  if(win){ playSfx('evolution',.9,1.35,0); setTimeout(()=>playSfx('upgrade',.62,1.35,0),180); }
  else if(reason==='retreat')playSfx('upgrade',.48,.82,0);
  else playSfx('boss',.75,.68,0);
  const earned = Math.floor(state.kills/10) + (win?10:0);
  const achievements=runAchievements();
  save.stars += earned;
  if(state.isEndless)saveEndlessRun(reason,earned,achievements); else recordRun();
  persist();
  document.getElementById('wrap').classList.add('settle-mode');
  const o=document.getElementById('over');
  const title=win?'🏆 通关!':reason==='retreat'?'🚀 战术撤离':'💥 防线失守';
  document.getElementById('overTitle').textContent=title;
  document.getElementById('overTitle').style.color=win||reason==='retreat'?'#8fe3b0':'#ff6b8a';
  document.getElementById('overSub').innerHTML =
    (win? MAP.name+' 已通关 · ':state.isEndless?MAPS[mapIndex].name+' 无尽远征已结算 · ':'坚守到第 '+state.wave+' 波 · ')+'得分 '+state.score+
    ' · 击杀 '+state.kills+' · 获得 <b style="color:#ffe08a">⭐'+earned+'</b>';
  const maxLevel=Math.max(0,...state.towers.map(t=>t.lvl));
  const stats=[['战场',MAPS[mapIndex].name],['波次',state.wave],['得分',state.score],['击杀',state.kills],
    ['漏怪',state.leaks],['时长',formatDuration(state.time)],['建塔',state.towers.length],['最高等级','Lv.'+maxLevel]];
  document.getElementById('overStats').innerHTML=stats.map(x=>`<div class="settle-item"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  document.getElementById('overAchievements').innerHTML=achievements.length?
    achievements.map(x=>`<div class="achievement">${x}</div>`).join(''):'<div class="empty-state" style="padding:4px">本局暂无额外成就</div>';
  const btns=document.getElementById('overBtns'); btns.innerHTML='';
  const mk=(txt,cls,fn)=>{ const b=document.createElement('button'); b.className='act '+cls; b.textContent=txt; b.onclick=fn; return b; };
  if(win && !state.isEndless && mapIndex<MAPS.length-1)btns.appendChild(mk('下一关 ▶','',()=>startGame(mapIndex+1,false)));
  btns.appendChild(mk('重试','sec',()=>startGame(mapIndex,state.isEndless)));
  if(state.isEndless){
    btns.appendChild(mk('换地图','',()=>openEndlessSelect('over')));
    btns.appendChild(mk('本地排行','sec',()=>openLeaderboard('over')));
  }
  btns.appendChild(mk('选关','warn',showMenu));
  o.classList.add('show');
  syncControls();
}
function victory(){ banner('通关!','#8fe3b0'); endGame(true); }
function gameOver(){ endGame(false,'defeat'); }

// ========== 启动 ==========
buildMenu();
syncControls();
